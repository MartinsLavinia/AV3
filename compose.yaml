services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greencode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greencode_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-AV3}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-greencode}:${POSTGRES_PASSWORD:-greencode_dev_only}@postgres:5432/${POSTGRES_DB:-AV3}?schema=public"
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - npm
      - exec
      - --
      - prisma
      - migrate
      - deploy
      - --config
      - prisma7.config.ts
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-greencode}:${POSTGRES_PASSWORD:-greencode_dev_only}@postgres:5432/${POSTGRES_DB:-AV3}?schema=public"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-greencode}:${POSTGRES_PASSWORD:-greencode_dev_only}@postgres:5432/${POSTGRES_DB:-AV3}?schema=public"
      REDIS_URL: redis://redis:6379
      ANALYTICS_WORKER_CONCURRENCY: ${ANALYTICS_WORKER_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
